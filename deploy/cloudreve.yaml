# Cloudreve (https://cloudreve.buunk.org). Settings, users and storage policies
# live in its database; files live in the S3 bucket cloudreve. One pod: the
# docs describe no multi-instance setup. The image is upstream's with our
# patches (image/): login through Keycloak, set by the OIDC_* variables.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudreve
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: cloudreve }
  template:
    metadata:
      labels: { app: cloudreve }
    spec:
      # conf.ini is written from the Secrets before Cloudreve starts. Not
      # env vars: Cloudreve logs every setting it takes from the
      # environment, database password included.
      initContainers:
        - name: config
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              umask 077
              cat > /cloudreve/data/conf.ini <<EOF
              [System]
              Mode = master
              Listen = :5212
              Debug = false
              SessionSecret = $SESSION_SECRET
              HashIDSalt = $HASH_ID_SALT

              [Database]
              Type = postgres
              Host = cloudreve-db-rw
              Port = 5432
              Name = cloudreve
              User = $DB_USER
              Password = $DB_PASSWORD
              EOF
          env:
            - name: SESSION_SECRET
              valueFrom: { secretKeyRef: { name: cloudreve-system, key: session-secret } }
            - name: HASH_ID_SALT
              valueFrom: { secretKeyRef: { name: cloudreve-system, key: hash-id-salt } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: cloudreve-db-app, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: cloudreve-db-app, key: password } }
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - { name: data, mountPath: /cloudreve/data }
      containers:
        - name: cloudreve
          image: ghcr.io/jurrebuunk/hgd1-cloudreve:4.19.1-oidc.1@sha256:e83332bb76dda6601cf68dac819ad782180bebb224f355a63193bde07ed24668
          ports: [{ containerPort: 5212 }]
          # Keycloak login (service/oidclogin in the patch). Not CR_*:
          # Cloudreve logs those values.
          env:
            - { name: OIDC_ISSUER, value: https://auth.buunk.org/realms/hgd1 }
            - { name: OIDC_CLIENT_ID, value: cloudreve }
            - { name: OIDC_CLIENT_SECRET_FILE, value: /run/secrets/oidc/client-secret }
            - { name: OIDC_REDIRECT_URL, value: https://cloudreve.buunk.org/api/v4/session/oidc/callback }
            - { name: OIDC_DISPLAY_NAME, value: buunk }
            # Keycloak client roles (hgd1-k8s realm) → Cloudreve groups 1 Admin, 2 User.
            - { name: OIDC_ROLE_GROUPS, value: "admin=1,user=2" }
          readinessProbe:
            tcpSocket: { port: 5212 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - { name: data, mountPath: /cloudreve/data }
            - { name: oidc, mountPath: /run/secrets/oidc, readOnly: true }
      volumes:
        - name: data
          emptyDir: {}
        - name: oidc
          secret: { secretName: cloudreve-oidc, defaultMode: 0400 }
---
apiVersion: v1
kind: Service
metadata:
  name: cloudreve
spec:
  selector: { app: cloudreve }
  ports: [{ port: 80, targetPort: 5212 }]
