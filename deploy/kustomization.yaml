# Cloudreve on the hgd1 cluster. Flux fetches this repo with hgd1-k8s's
# components/ added (GitRepository include in hgd1-k8s/apps/cloudreve.yaml),
# so ../components/postgres gives the database its defaults and backups.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudreve
resources:
  - namespace.yaml
  - database.yaml
  - s3-key.sops.yaml
  - system.sops.yaml
  - oidc.sops.yaml
  - s3-gateway.yaml
  - cloudreve.yaml
components:
  - ../components/postgres
  # Pods reach the cluster, the internet and S3, nothing else on the site.
  - ../components/egress/default
  - ../components/egress/s3
configMapGenerator:
  - name: s3-gateway
    files: [default.conf=s3-gateway.conf]
