# Cloudreve's Postgres: two servers on different hosts, backed up to
# s3://pg-backups/cloudreve-db/ (from components/postgres in hgd1-k8s).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cloudreve-db
spec:
  instances: 2
  storage: { size: 5Gi }
  bootstrap:
    initdb: { database: cloudreve, owner: cloudreve }
