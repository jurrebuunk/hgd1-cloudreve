map "$args|$http_authorization" $ct_signed {
  "~*content-type" 1;
  default 0;
}
map $ct_signed $upstream_ct {
  1 $http_content_type;
  default "";
}
server {
  listen 8080;
  client_max_body_size 0;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_http_version 1.1;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  location = /healthz { access_log off; return 200 "ok\n"; }

  location ~ ^/cloudreve(/|$) {
    proxy_set_header Host $host;
    proxy_set_header Content-Type $upstream_ct;
    proxy_set_header Connection "";
    proxy_pass https://s3.lan.buunk.org;
    proxy_ssl_server_name on;
    proxy_ssl_name s3.lan.buunk.org;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3; # leaf, intermediate, root (Let's Encrypt)
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  }

  location / { return 404; }
}
